# ─────────────────────────────────────────────────────────────────────────────
# Fitssort Membership — PRODUCTION Android build (release APK + AAB)
#
# Build signed release artifacts on the VPS / CI and copy them to ./output:
#
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up
#
# Result:
#   ./output/fitssort-membership-release.apk   (sideload / direct download)
#   ./output/fitssort-membership-release.aab   (Google Play upload)
#
# The release variant is configured against https://fitssort.com via .env.prod.
# Replace the bundled debug keystore with a real upload keystore before
# publishing to the Play Store (see android/build.gradle signingConfigs).
# ─────────────────────────────────────────────────────────────────────────────
services:
  android-build:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: fitssort-membership-android:latest
    container_name: fitssort-membership-android
    env_file: .env.prod
    volumes:
      - ./output:/output
    restart: "no"
